name: Generate SDK

on:
  # Run weekly every Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'

  # Trigger manually from the Actions tab
  workflow_dispatch:
    inputs:
      openapi_generator_version:
        description: 'openapi-generator-cli version (leave blank for latest)'
        required: false
        default: ''

  # Run when the generator config or script itself changes
  push:
    branches: [master]
    paths:
      - 'bin/openapi-generate'
      - '.openapi-config.json'
      - '.openapi-generator-ignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Regenerate SDK from OpenAPI specs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache generator JAR
        uses: actions/cache@v4
        with:
          path: openapi-generator-cli-*.jar
          key: openapi-generator-${{ inputs.openapi_generator_version || 'latest' }}

      - name: Pin generator version (if specified)
        if: inputs.openapi_generator_version != ''
        run: |
          VERSION="${{ inputs.openapi_generator_version }}"
          JAR="openapi-generator-cli-${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            wget "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${VERSION}/openapi-generator-cli-${VERSION}.jar" \
              -O "$JAR"
          fi
          echo "OPENAPI_GENERATOR_JAR=${JAR}" >> "$GITHUB_ENV"

      - name: Run bin/openapi-generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/openapi-generate

      - name: Check for changes
        id: diff
        run: |
          git add lib/ docs/ spec/ README.md .openapi-generator/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No spec changes detected — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Changed files" >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --name-only | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            lib/
            docs/
            spec/
            README.md
            .openapi-generator/
          branch: auto/regenerate-sdk
          delete-branch: true
          commit-message: 'chore: regenerate SDK from latest Azure OpenAPI specs'
          title: 'chore: regenerate SDK from latest Azure OpenAPI specs'
          body: |
            Automated regeneration of the `azure_rest` Ruby gem from the latest
            stable Azure REST API OpenAPI specs sourced from
            https://github.com/Azure/azure-rest-api-specs

            Triggered by: `${{ github.event_name }}`
          labels: |
            autogenerated
            sdk-update
